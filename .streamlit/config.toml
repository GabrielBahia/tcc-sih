[browser]
gatherUsageStats = false

[server]
address = "localhost"
headless = true

[client]
toolbarMode = "viewer"

[theme]
base = "light"
primaryColor = "#000000"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F2F2"
textColor = "#000000"
linkColor = "#000000"
codeTextColor = "#000000"
codeBackgroundColor = "#F2F2F2"
borderColor = "#D9D9D9"
dataframeBorderColor = "#D9D9D9"
dataframeHeaderBackgroundColor = "#F2F2F2"
showWidgetBorder = true
baseRadius = "small"
headingFontSizes = ["2rem", "1.4rem", "1.15rem"]
headingFontWeights = [700, 600, 600]
metricValueFontSize = "1.75rem"
chartCategoricalColors = ["#000000", "#555555", "#999999"]
